name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-model-spike:
    name: Session model spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/session-model
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/session-model/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # One stable check name for branch protection to require, however many jobs exist above.
  passed:
    name: CI passed
    if: always()
    needs: [session-model-spike]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        run: test "${{ needs.session-model-spike.result }}" = "success"
